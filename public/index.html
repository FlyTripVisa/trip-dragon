<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Muse Chat</title>
  <meta name="description" content="A streaming AI chat powered by the Muse API.">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script>
    /* Apply the saved theme before first paint to avoid a flash. */
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("muse-theme"); } catch (e) {}
      var theme = saved === "light" || saved === "dark"
        ? saved
        : (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.dataset.theme = theme;
    })();
  </script>
</head>
<body>
  <div class="app">

    <!-- Top bar -->
    <header class="topbar">
      <div class="brand">
        <span class="brand__logo" aria-hidden="true">✦</span>
        <span class="brand__name">Muse&nbsp;Chat</span>
        <span id="modelTag" class="brand__model" hidden></span>
      </div>
      <div class="topbar__actions">
        <button id="themeBtn" class="icon-btn" type="button" title="Toggle theme" aria-label="Toggle theme">
          <svg class="icon icon--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button id="newChatBtn" class="icon-btn" type="button" title="New chat" aria-label="New chat">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        </button>
      </div>
    </header>

    <!-- Shown when the deployment is missing API configuration -->
    <div id="configBanner" class="banner" role="alert" hidden>
      <span class="banner__icon" aria-hidden="true">⚠</span>
      <span>Server is not configured yet — set <code>MUSE_API_ENDPOINT</code> and <code>MUSE_API_KEY</code> in your Cloudflare Worker settings.</span>
    </div>

    <!-- Message list -->
    <main id="chat" class="chat">
      <section id="welcome" class="welcome">
        <div class="welcome__glow" aria-hidden="true">✦</div>
        <h1>Hi, I&rsquo;m Muse</h1>
        <p>Ask me anything — answers stream in real&nbsp;time.</p>
        <div id="suggestions" class="welcome__suggestions"></div>
      </section>
      <!-- messages are appended here by app.js -->
    </main>

    <button id="scrollBtn" class="scroll-btn" type="button" aria-label="Scroll to latest message" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </button>

    <!-- Composer -->
    <footer class="composer">
      <form id="composerForm" class="composer__inner">
        <textarea id="input" class="composer__input" rows="1" placeholder="Message Muse…" autocomplete="off" autofocus></textarea>
        <button id="sendBtn" class="send-btn" type="submit" aria-label="Send message" title="Send">
          <svg class="send-btn__icon send-btn__icon--send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
          <svg class="send-btn__icon send-btn__icon--stop" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
      </form>
      <p class="composer__hint">Muse can make mistakes — verify important information.</p>
    </footer>

  </div>
  <script src="app.js"></script>
</body>
</html>
